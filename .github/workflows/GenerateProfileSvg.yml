# https://github.com/NeetheCheeBao

name: generate profile svg

on:
  # 每12小时自动运行一次（UTC）
  schedule:
    - cron: "0 */12 * * *"

  # 允许手动随时触发
  workflow_dispatch:

  # 向main分支推送代码时触发
  push:
    branches:
    - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: prepare dist
        run: mkdir -p dist

      # Snake 贡献墙贪吃蛇
      - name: generate github-contribution-grid-snake.svg
        continue-on-error: true
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: NeetheCheeBao
          outputs: |
            dist/github-contribution-grid-snake.svg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Stats 总览统计
      - name: generate stats.svg
        continue-on-error: true
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: >-
            username=NeetheCheeBao&show_icons=true&theme=ambient_gradient&rank_icon=github
          path: dist/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # Top langs 常用语言
      - name: generate top-langs.svg
        continue-on-error: true
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: >-
            username=NeetheCheeBao&layout=donut&bg_color=40,f04d4d,ff4af3,608bf9&title_color=fff&text_color=fff
          path: dist/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # Streak 连续贡献
      - name: generate streak.svg
        continue-on-error: true
        uses: DenverCoder1/github-readme-streak-stats@main
        with:
          options: user=NeetheCheeBao&theme=gruvbox_light&disable_animations=true
          path: dist/streak.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # Profile details 基本信息汇总
      - name: generate profile-details.svg
        continue-on-error: true
        uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: NeetheCheeBao
          THEME: github
          AUTO_PUSH: false

      - name: collect profile-details.svg
        continue-on-error: true
        run: |
          src=$(find profile-summary-card-output -type f -name '*profile-details*.svg' | head -n 1 || true)
          if [ -n "${src}" ] && [ -s "${src}" ]; then
            cp "${src}" dist/profile-details.svg
            echo "ok: dist/profile-details.svg from ${src}"
          else
            echo "warn: profile-details.svg not found, skip"
            find profile-summary-card-output -type f 2>/dev/null || true
          fi

      - name: check outputs
        run: |
          count=$(find dist -type f -name '*.svg' | wc -l)
          echo "generated svg count: ${count}"
          ls -la dist || true
          if [ "${count}" -eq 0 ]; then
            echo "error: no svg generated"
            exit 1
          fi

      - name: push assets to the profilesvg branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: profilesvg
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

