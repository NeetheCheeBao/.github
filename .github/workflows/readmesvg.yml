name: generate profile assets

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: prepare dist
        run: mkdir -p dist

      # Snake
      - name: generate github-contribution-grid-snake.svg
        continue-on-error: true
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Stats
      - name: generate stats.svg
        continue-on-error: true
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: >-
            username=${{ github.repository_owner }}&show_icons=true&theme=ambient_gradient&rank_icon=github
          path: dist/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # Top languages
      - name: generate top-langs.svg
        continue-on-error: true
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: >-
            username=${{ github.repository_owner }}&layout=donut&bg_color=40,f04d4d,ff4af3,608bf9&title_color=fff&text_color=fff
          path: dist/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # Streak
      - name: generate streak.svg
        continue-on-error: true
        uses: DenverCoder1/github-readme-streak-stats@main
        with:
          options: user=${{ github.repository_owner }}&theme=gruvbox_light&disable_animations=true
          path: dist/streak.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # 至少有一张 SVG 才推，避免空推
      - name: check outputs
        run: |
          count=$(find dist -type f -name '*.svg' | wc -l)
          echo "generated svg count: ${count}"
          ls -la dist || true
          if [ "${count}" -eq 0 ]; then
            echo "error: no svg generated"
            exit 1
          fi

      - name: push assets to the profilesvg branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: profilesvg
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}